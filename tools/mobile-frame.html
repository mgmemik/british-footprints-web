<!doctype html>
<!-- Used by tools/shoot.py: headless Chrome cannot make windows narrower than ~500 px,
     so mobile screenshots render the page in a 390 px iframe. -->
<html><body style="margin:0;background:#888">
<iframe id="f" style="border:0;width:390px;height:9000px;display:block"></iframe>
<script>document.getElementById("f").src = decodeURIComponent(location.search.slice(5));</script>
</body></html>
