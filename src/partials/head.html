    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0F1722" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4ECDC" media="(prefers-color-scheme: light)" />
    <script>
      /* Theme before first paint: ?theme= (for previews), saved choice, else the system setting (dark unless the system asks for light). */
      (function () {
        var d = document.documentElement, t = null;
        try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("bf_theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        d.setAttribute("data-theme", t);
        try {
          var q = new URLSearchParams(location.search).get("lang") || localStorage.getItem("bf_lang");
          if (q === "tr" || q === "en") d.lang = q;
        } catch (e) {}
      })();
    </script>
